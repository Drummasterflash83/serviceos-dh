# ServiceOS — Supabase project config.
#
# Only per-function JWT settings are declared here; every other setting uses the
# CLI defaults. Functions not listed keep the default (verify_jwt = true), so the
# existing phone/simwood functions are unaffected.

# Gmail OAuth start — authenticated (owner/admin/ops). Keep JWT verification ON.
[functions.gmail-oauth-start]
verify_jwt = true

# Gmail OAuth callback — Google redirects the browser here with NO Supabase JWT,
# so gateway JWT verification MUST be off. Trust comes from the HMAC-signed
# `state` verified inside the function (see _shared/gmail_oauth.ts).
[functions.gmail-oauth-callback]
verify_jwt = false

# Scheduled phone sync — invoked by cron with NO Supabase JWT, so gateway JWT
# verification MUST be off. Trust comes from the `x-schedule-secret` header
# checked inside the function against PHONE_SCHEDULE_SECRET.
[functions.phone-scheduled-sync]
verify_jwt = false

# Scheduled Gmail sync — same model as phone-scheduled-sync, gated by
# EMAIL_SCHEDULE_SECRET (cron has no Supabase JWT).
[functions.email-scheduled-sync]
verify_jwt = false

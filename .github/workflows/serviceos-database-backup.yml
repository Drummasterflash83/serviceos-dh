name: ServiceOS independent database backup

# Manual hosted rehearsal only. Enable the daily schedule after source, restore,
# off-site copy and missed-success monitoring have been verified end to end.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceos-independent-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'Drummasterflash83/serviceos-dh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: serviceos-database-backup
    timeout-minutes: 300
    steps:
      - name: Check out reviewed backup source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eda9e747adb554000b09a9ead1f85fc8ba0ad9db
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare pinned public tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/backup --ignore-scripts
          mkdir -p /tmp/serviceos-age-1.3.2
          curl --fail --location --silent --show-error \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-arm64.tar.gz \
            --output /tmp/serviceos-age-v1.3.2-linux-arm64.tar.gz
          printf '%s  %s\n' \
            6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4 \
            /tmp/serviceos-age-v1.3.2-linux-arm64.tar.gz | sha256sum --check --status
          tar -xOzf /tmp/serviceos-age-v1.3.2-linux-arm64.tar.gz age/age \
            > /tmp/serviceos-age-1.3.2/age
          chmod 700 /tmp/serviceos-age-1.3.2/age
          printf '%s  %s\n' \
            41b072352f4561018949623c674d16ef704019b9108a9bbdbd21292efebfc94f \
            /tmp/serviceos-age-1.3.2/age | sha256sum --check --status
          docker pull public.ecr.aws/supabase/postgres@sha256:ba10e934f0a59990379f78ab9ed93926f1c291dd61a12fe4026f4202f1b89770
          docker tag \
            public.ecr.aws/supabase/postgres@sha256:ba10e934f0a59990379f78ab9ed93926f1c291dd61a12fe4026f4202f1b89770 \
            public.ecr.aws/supabase/postgres:17.6.1.141
          test "$(docker image inspect public.ecr.aws/supabase/postgres:17.6.1.141 --format '{{.Id}}')" = \
            sha256:ba10e934f0a59990379f78ab9ed93926f1c291dd61a12fe4026f4202f1b89770
          mkdir -m 700 .verification-results
      - name: Export, restore, encrypt and verify independent off-site copy
        shell: bash
        env:
          SERVICEOS_DATABASE_SOURCE_READER_JSON: ${{ secrets.SERVICEOS_DATABASE_SOURCE_READER_JSON }}
          SERVICEOS_DATABASE_BACKUP_WRITER_JSON: ${{ secrets.SERVICEOS_DATABASE_BACKUP_WRITER_JSON }}
          SERVICEOS_DATABASE_BACKUP_RESTORE_JSON: ${{ secrets.SERVICEOS_DATABASE_BACKUP_RESTORE_JSON }}
        run: |
          set -euo pipefail
          test -n "$SERVICEOS_DATABASE_SOURCE_READER_JSON"
          test -n "$SERVICEOS_DATABASE_BACKUP_WRITER_JSON"
          test -n "$SERVICEOS_DATABASE_BACKUP_RESTORE_JSON"
          node scripts/backup/run-daily-database-backup.mjs --run-once
      - name: Remove private runner files
        if: always()
        shell: bash
        run: rm -rf .verification-results /tmp/serviceos-age-1.3.2 /tmp/serviceos-age-v1.3.2-linux-arm64.tar.gz

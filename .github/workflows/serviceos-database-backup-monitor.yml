name: ServiceOS database backup missed-success check

# Check the last successful hosted backup every hour; a stale or missing copy
# fails this workflow without loading database or AWS credentials.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: github.repository == 'Drummasterflash83/serviceos-dh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check out reviewed monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3b586315bffe48973d2f9610e2c7489147752be0
          persist-credentials: false
      - name: Check last successful independent database copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/backup/check-daily-backup-success.mjs

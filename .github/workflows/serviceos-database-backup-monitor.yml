name: ServiceOS database backup missed-success check

# Enable an hourly schedule only after the first hosted backup succeeds.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: github.repository == 'Drummasterflash83/serviceos-dh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check out reviewed monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/learn-v1-test
          persist-credentials: false
      - name: Check last successful independent database copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/backup/check-daily-backup-success.mjs

name: ServiceOS database backup missed-success check

# Check once after the final daily backup fallback slot. A stale or missing
# scheduled copy fails this workflow without loading database or AWS credentials.
# One daily alert avoids repeated failure emails for the same missing copy.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: github.repository == 'Drummasterflash83/serviceos-dh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check out reviewed monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1cdabd2a19003e6e12493bd0f49a521710136b12
          persist-credentials: false
      - name: Check last successful independent database copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/backup/check-daily-backup-success.mjs
